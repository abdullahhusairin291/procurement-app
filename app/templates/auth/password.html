{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Ubah password{% endblock %}
{% block content %}
<div class="row"><div class="col-md-5">
  <h4>Ubah password</h4>
  <form method="post" class="card card-body">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label">Password lama</label><input class="form-control" type="password" name="old_password" required></div>
    <div class="mb-3"><label class="form-label">Password baru (min. 8 karakter)</label><input class="form-control" type="password" name="new_password" required></div>
    <div class="mb-3"><label class="form-label">Ulangi password baru</label><input class="form-control" type="password" name="confirm_password" required></div>
    <button class="btn btn-primary">Simpan</button>
  </form>
</div></div>
{% endblock %}
