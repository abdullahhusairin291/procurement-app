{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="row"><div class="col-md-5">
  <h4>Profil saya</h4>
  <form method="post" class="card card-body">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control" value="{{ current_user.username }}" disabled></div>
    <div class="mb-3"><label class="form-label">Role</label><input class="form-control" value="{{ current_user.role_label }}" disabled></div>
    <div class="mb-3"><label class="form-label">Nama lengkap</label><input class="form-control" name="full_name" value="{{ current_user.full_name }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" value="{{ current_user.email or '' }}"></div>
    <button class="btn btn-primary">Simpan</button>
  </form>
</div></div>
{% endblock %}
