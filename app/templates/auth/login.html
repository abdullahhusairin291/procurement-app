{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <div class="card shadow-sm mt-5"><div class="card-body">
    <h4 class="mb-3">Masuk</h4>
    <form method="post">
      {{ csrf() }}
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autofocus required></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
